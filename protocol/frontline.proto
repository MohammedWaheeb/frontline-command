syntax = "proto3";
package frontline.v1;
option go_package = "frontlinecommand/protocol;protocol";

// A WebSocket binary frame contains exactly one Envelope. The server rejects
// text frames, unknown message kinds, oversized frames and incompatible hello.
message Envelope {
  oneof message {
    ClientHello hello = 1;
    OrderBatch orders = 2;
    OrderResult order_result = 3;
    PlayerSnapshot snapshot = 4;
    StateDelta delta = 5;
    ResumeMatch resume = 6;
    MatchResult result = 7;
    ProtocolError error = 8;
    Ping ping = 9;
  }
}
message ClientHello { uint32 protocol = 1; string simulation = 2; string content_hash = 3; string token = 4; string match_id = 5; }
message ResumeMatch { ClientHello hello = 1; uint32 last_tick = 2; }
message Ping { uint32 nonce = 1; }
message ProtocolError { string code = 1; string message = 2; bool recoverable = 3; }
message Vec { sint32 x = 1; sint32 y = 2; }
message Order { string kind = 1; repeated uint32 entities = 2; uint32 target = 3; Vec position = 4; string type = 5; bool queued = 6; int32 index = 7; repeated Vec points = 8; }
message OrderBatch { uint32 sequence = 1; repeated Order orders = 2; }
message OrderResult { uint32 player = 1; uint32 sequence = 2; int32 index = 3; bool accepted = 4; string code = 5; uint32 tick = 6; }
message Metadata { string simulation = 1; uint32 protocol = 2; string content_hash = 3; string map_version = 4; string ruleset = 5; uint64 seed = 6; }
message Cooldown { string id = 1; uint32 until = 2; }
message Job { string type = 1; bool research = 2; int64 paid = 3; uint32 work = 4; uint32 required = 5; int32 supply = 6; uint32 service = 7; bool started = 8; bool emergency = 9; }
message Economy { int64 credits = 1; int64 energy = 2; int32 supply = 3; int32 reserved_supply = 4; int32 power_capacity = 5; int32 power_demand = 6; int32 tier = 7; int64 income = 8; int64 repair_reserve = 9; repeated string upgrades = 10; repeated Cooldown cooldowns = 11; }
message EntityPrivate { int64 hp = 1; int64 max_hp = 2; repeated Job jobs = 3; repeated Order orders = 4; Vec rally = 5; int64 cargo = 6; uint32 home = 7; int32 ammo = 8; uint32 endurance = 9; int32 charges = 10; uint32 charge_work = 11; uint32 service_work = 12; int64 experience = 13; repeated Cooldown cooldowns = 14; repeated uint32 passengers = 15; uint32 container = 16; }
message Entity { uint32 id = 1; string type = 2; uint32 owner = 3; Vec position = 4; int32 facing = 5; int32 health = 6; string state = 7; bool complete = 8; bool enabled = 9; bool landed = 10; bool deployed = 11; bool concealed = 12; int32 progress = 13; uint32 rank = 14; EntityPrivate private = 15; int32 turret_facing = 16; uint32 channel_until = 17; uint32 map_object = 18; }
message PlayerSummary { uint32 id = 1; string name = 2; string faction = 3; uint32 team = 4; bool defeated = 5; uint32 defeat_at = 6; int32 strategic_progress = 7; }
message Projectile { uint32 id = 1; uint32 owner = 2; string weapon = 3; Vec position = 4; Vec impact = 5; uint32 impact_at = 6; bool interceptable = 7; bool warning = 8; }
message Field { uint32 id = 1; Vec position = 2; int64 remaining = 3; }
message Station { uint32 id = 1; Vec position = 2; uint32 owner = 3; }
message Memory { uint32 id = 1; string type = 2; uint32 owner = 3; Vec position = 4; uint32 seen = 5; }
message Event { uint32 id = 1; uint32 tick = 2; string kind = 3; uint32 owner = 4; uint32 entity = 5; Vec position = 6; int64 value = 7; string scope = 8; string text = 9; }
message Outcome { bool finished = 1; bool draw = 2; uint32 winning_team = 3; string reason = 4; uint32 tick = 5; }
message PlayerSnapshot { Metadata metadata = 1; uint32 tick = 2; uint32 countdown = 3; uint32 player = 4; Economy economy = 5; repeated PlayerSummary players = 6; repeated Entity entities = 7; repeated Projectile projectiles = 8; repeated Field fields = 9; repeated Station stations = 10; repeated bool explored = 11 [packed=true]; repeated bool visible = 12 [packed=true]; repeated Memory memory = 13; repeated Event events = 14; repeated OrderResult results = 15; uint32 shipment_at = 16; Outcome outcome = 17; repeated Salvage salvage = 18; repeated Zone zones = 19; repeated StructureIndicator indicators = 20; MissionProgress mission = 21; repeated uint32 rubble = 22; repeated OperationWarning warnings = 23; }
// state contains current permitted non-entity fields and only changed entities;
// removed_entities includes deaths and lost vision without revealing which.
message StateDelta { uint32 baseline_tick = 1; PlayerSnapshot state = 2; repeated uint32 removed_entities = 3; }
message MatchResult { string match_id = 1; Outcome outcome = 2; bool committed = 3; bool void = 4; }

message Salvage { uint32 id = 1; uint32 owner = 2; Vec position = 3; int64 value = 4; uint32 until = 5; }
message Zone { string kind = 1; uint32 owner = 2; Vec position = 3; int32 radius = 4; uint32 start = 5; uint32 until = 6; }
message StructureIndicator { uint32 owner = 1; Vec position = 2; }
message ObjectiveProgress { string id = 1; string text = 2; bool optional = 3; bool failure = 4; bool complete = 5; uint32 progress = 6; uint32 required = 7; }
message MissionProgress { string id = 1; string title = 2; string difficulty = 3; string checkpoint = 4; uint32 checkpoint_tick = 5; repeated ObjectiveProgress objectives = 6; }

message OperationWarning { string kind = 1; uint32 owner = 2; Vec position = 3; uint32 at = 4; uint32 source = 5; repeated Vec exits = 6; }
